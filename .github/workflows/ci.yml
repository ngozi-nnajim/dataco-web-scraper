# ============================================================
# DataCo Web Scraper — CI Workflow
# ============================================================
# Runs automatically on every push to main and every
# Pull Request — verifies code quality and all tests pass.
# ============================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Get the code ─────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Step 3: Cache dependencies ───────────────────────
      # Caching means GitHub saves the installed packages
      # between runs — so we don't reinstall everything from
      # scratch every single time. Much faster.
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Step 4: Install dependencies ─────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ── Step 5: Run linter ───────────────────────────────
      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      # ── Step 6: Run tests ────────────────────────────────
      - name: Run tests with pytest
        run: |
          pytest tests/ -v